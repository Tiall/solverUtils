<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolverUtils/Minecraft</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="mineScript.js"></script>
</head>
<body>
    <h1>Solver Utils : Minecraft</h1>
    <hr />

    <h2>Stack/Chest Quantity Solver</h2>

            <input type="number" name="itemAmount" oninput="onItemAmountChanged(event)" id="itemAmount">
            <h4>Output: <span id="itemAmountValue"></span></h4>
        </div>
    </div>
